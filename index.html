<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KARDOBU Store</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><header class="top"><div class="wrap nav"><div class="brand">KARDOBU<i>.</i></div><button class="btn dark" onclick="openCart()">KERANJANG (<span id="cc">0</span>)</button></div></header><section class="hero"><div class="wrap"><div class="muted">KARDOBU STORE</div><h1 id="ht">WEAR YOUR IDENTITY.</h1><p id="hs" class="muted">Premium streetwear dengan karakter kuat.</p><button class="btn" onclick="document.getElementById('products').scrollIntoView()">BELANJA</button></div></section><section class="section"><div class="wrap"><h2>Produk</h2><div id="products" class="grid">Memuat...</div></div></section><div id="pm" class="modal"><div id="pb" class="modalbox"></div></div><div id="cm" class="modal"><div class="modalbox"><h2>Checkout</h2><div id="ci"></div><h3 id="ct">Rp0</h3><label>Nama</label><input id="cn"><label>WhatsApp</label><input id="cp" placeholder="628xxxxxxxxxx"><label>Alamat</label><textarea id="ca"></textarea><label>Catatan</label><textarea id="note"></textarea><br><br><button class="btn" onclick="checkout()">KONFIRMASI & WHATSAPP</button> <button class="btn dark" onclick="cm.classList.remove('open')">TUTUP</button><div id="msg"></div></div></div><script>
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let ps=[],cart=[];const rp=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n||0),esc=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');async function init(){let s=await db.from('store_settings').select('*').eq('id',1).maybeSingle();if(s.data){ht.textContent=s.data.hero_title;hs.textContent=s.data.hero_subtitle}let r=await db.from('products').select('*').order('created_at',{ascending:false});if(r.error){products.innerHTML='<p class="danger">'+esc(r.error.message)+'</p>';return}ps=r.data||[];products.innerHTML=ps.map(p=>'<article class="card"><img src="'+esc(p.image_url||'')+'"><div class="cardbody"><span class="tag">'+esc(p.status)+'</span><h3>'+esc(p.name)+'</h3><div class="price">'+rp(p.price)+'</div><p class="muted">'+esc(p.description)+'</p><button class="btn" onclick="pick(\''+p.id+'\')">BELI</button></div></article>').join('')||'<p class="muted">Belum ada produk.</p>'}function pick(id){let p=ps.find(x=>x.id===id);pb.innerHTML='<h2>'+esc(p.name)+'</h2><p class="price">'+rp(p.price)+'</p><label>Ukuran</label><select id="sz">'+(p.sizes||[]).map(s=>'<option>'+esc(s)+'</option>').join('')+'</select><label>Jumlah</label><input id="qty" type="number" min="1" max="'+p.stock+'" value="1"><br><br><button class="btn" onclick="add(\''+p.id+'\')">TAMBAH</button> <button class="btn dark" onclick="pm.classList.remove(\'open\')">TUTUP</button>';pm.classList.add('open')}function add(id){let p=ps.find(x=>x.id===id);cart.push({p:p,size:sz.value,qty:Number(qty.value)||1});pm.classList.remove('open');renderCart();openCart()}function renderCart(){cc.textContent=cart.reduce((a,x)=>a+x.qty,0);ci.innerHTML=cart.length?cart.map((x,i)=>'<div class="cartline"><span>'+esc(x.p.name)+'<br><small>'+esc(x.size)+' × '+x.qty+'</small></span><span>'+rp(x.p.price*x.qty)+'<br><button class="btn dark" onclick="cart.splice('+i+',1);renderCart()">Hapus</button></span></div>').join(''):'<p class="muted">Keranjang kosong.</p>';ct.textContent=rp(cart.reduce((a,x)=>a+x.p.price*x.qty,0))}function openCart(){renderCart();cm.classList.add('open')}async function checkout(){if(!cart.length)return alert('Keranjang kosong');if(!cn.value.trim()||!cp.value.trim())return msg.innerHTML='<p class="danger">Nama dan WhatsApp wajib diisi.</p>';let total=cart.reduce((a,x)=>a+x.p.price*x.qty,0),code='KDB-'+Date.now().toString().slice(-8),lines=cart.map(x=>x.p.name+' | '+x.size+' | '+x.qty).join('\n'),text='Halo KARDOBU, saya ingin membeli.\n\nOrder: '+code+'\nNama: '+cn.value+'\nWhatsApp: '+cp.value+'\nAlamat: '+ca.value+'\n\n'+lines+'\n\nTotal: '+rp(total)+'\nCatatan: '+(note.value||'-');let r=await db.from('orders').insert({order_code:code,customer_name:cn.value.trim(),customer_phone:cp.value.trim(),customer_address:ca.value.trim(),note:note.value.trim(),total_amount:total,whatsapp_message:text}).select().single();if(r.error)return msg.innerHTML='<p class="danger">'+esc(r.error.message)+'</p>';for(let x of cart)await db.from('order_items').insert({order_id:r.data.id,product_id:x.p.id,product_name:x.p.name,size:x.size,quantity:x.qty,price:x.p.price,subtotal:x.p.price*x.qty});window.open('https://wa.me/'+KARDOBU_WHATSAPP+'?text='+encodeURIComponent(text),'_blank');msg.innerHTML='<p class="ok">Pesanan tersimpan dan WhatsApp dibuka.</p>';cart=[];renderCart()}init();
</script></body></html>
