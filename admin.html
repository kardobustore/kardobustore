<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KARDOBU Admin</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><header class="top"><div class="wrap nav"><div class="brand">KARDOBU<i>.</i> ADMIN</div><button id="lo" class="btn dark" style="display:none" onclick="logout()">LOGOUT</button></div></header><div class="wrap"><div id="login" class="panel" style="max-width:430px;margin:90px auto"><h1>Admin Login</h1><label>Email</label><input id="em"><label>Password</label><input id="pw" type="password"><br><br><button class="btn" onclick="login()">MASUK</button><div id="lm"></div></div><div id="dash" style="display:none"><section class="section"><h1>Dashboard KARDOBU</h1><div class="grid"><div class="panel"><span class="muted">PRODUK</span><h2 id="sp">0</h2></div><div class="panel"><span class="muted">ORDER</span><h2 id="so">0</h2></div><div class="panel"><span class="muted">PENDING</span><h2 id="sn">0</h2></div></div></section><div class="panel"><h2>Produk</h2><input type="hidden" id="id"><label>Nama</label><input id="name"><div class="row"><div><label>Harga</label><input id="price" type="number"></div><div><label>Stok</label><input id="stock" type="number"></div></div><label>Ukuran</label><input id="sizes" value="S,M,L,XL"><label>Status</label><select id="status"><option>READY</option><option>PRE-ORDER</option><option>SOLD OUT</option></select><label>URL Foto</label><input id="image"><label>Deskripsi</label><textarea id="desc"></textarea><br><br><button class="btn" onclick="save()">SIMPAN</button> <button class="btn dark" onclick="resetP()">RESET</button><div id="pmg"></div></div><div class="panel"><h2>Daftar Produk</h2><div id="pl">Memuat...</div></div><div class="panel"><h2>Pesanan</h2><div id="ol">Memuat...</div></div><div class="panel"><h2>Pengaturan</h2><label>Nama Toko</label><input id="shop"><label>WhatsApp tanpa +</label><input id="wa"><label>Instagram</label><input id="ig"><label>Judul</label><input id="hero"><label>Subjudul</label><textarea id="sub"></textarea><label>URL QRIS</label><input id="qris"><br><br><button class="btn" onclick="settingsSave()">SIMPAN</button><div id="sm"></div></div></div></div><script>
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),rp=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n||0),esc=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');async function login(){lm.textContent='Login...';let r=await db.auth.signInWithPassword({email:em.value.trim(),password:pw.value});if(r.error){lm.innerHTML='<p class="danger">'+esc(r.error.message)+'</p>';return}login.style.display='none';dash.style.display='block';lo.style.display='block';load()}async function logout(){await db.auth.signOut();location.reload()}async function load(){let p=await db.from('products').select('*').order('created_at',{ascending:false});sp.textContent=p.data?.length||0;pl.innerHTML=(p.data||[]).map(x=>'<div class="cartline"><span><b>'+esc(x.name)+'</b><br><small>'+rp(x.price)+' · Stok '+x.stock+'</small></span><span><button class="btn dark" onclick=edit('+JSON.stringify(x)+')>EDIT</button> <button class="btn dark" onclick=del(\''+x.id+'\')>HAPUS</button></span></div>').join('')||'<p class="muted">Kosong.</p>';let o=await db.from('orders').select('*').order('created_at',{ascending:false});so.textContent=o.data?.length||0;sn.textContent=(o.data||[]).filter(x=>x.payment_status==='PENDING').length;ol.innerHTML=(o.data||[]).map(x=>'<div class="panel"><b>'+esc(x.order_code)+'</b><p>'+esc(x.customer_name)+' · '+esc(x.customer_phone)+'</p><p>'+rp(x.total_amount)+'</p><select onchange="stat(\''+x.id+'\',this.value)"><option '+(x.payment_status==='PENDING'?'selected':'')+'>PENDING</option><option '+(x.payment_status==='PAID'?'selected':'')+'>PAID</option><option '+(x.payment_status==='CANCELLED'?'selected':'')+'>CANCELLED</option></select></div>').join('')||'<p class="muted">Belum ada order.</p>';let s=await db.from('store_settings').select('*').eq('id',1).single();if(s.data){shop.value=s.data.shop_name||'';wa.value=s.data.whatsapp_number||'';ig.value=s.data.instagram||'';hero.value=s.data.hero_title||'';sub.value=s.data.hero_subtitle||'';qris.value=s.data.qris_image_url||''}}function edit(x){id.value=x.id;name.value=x.name;price.value=x.price;stock.value=x.stock;sizes.value=(x.sizes||[]).join(',');status.value=x.status;image.value=x.image_url||'';desc.value=x.description||';window.scrollTo(0,0)}function resetP(){id.value='';name.value='';price.value='';stock.value=0;sizes.value='S,M,L,XL';status.value='READY';image.value='';desc.value=''}async function save(){let x={name:name.value.trim(),price:+price.value||0,stock:+stock.value||0,sizes:sizes.value.split(',').map(x=>x.trim()).filter(Boolean),status:status.value,image_url:image.value.trim(),description:desc.value.trim(),updated_at:new Date().toISOString()};let r=id.value?await db.from('products').update(x).eq('id',id.value):await db.from('products').insert(x);if(r.error)pmg.innerHTML='<p class="danger">'+esc(r.error.message)+'</p>';else{pmg.innerHTML='<p class="ok">Tersimpan.</p>';resetP();load()}}async function del(i){if(confirm('Hapus produk?')){let r=await db.from('products').delete().eq('id',i);if(r.error)alert(r.error.message);else load()}}async function stat(i,s){let r=await db.from('orders').update({payment_status:s}).eq('id',i);if(r.error)alert(r.error.message);else load()}async function settingsSave(){let r=await db.from('store_settings').update({shop_name:shop.value,whatsapp_number:wa.value,instagram:ig.value,hero_title:hero.value,hero_subtitle:sub.value,qris_image_url:qris.value,updated_at:new Date().toISOString()}).eq('id',1);sm.innerHTML=r.error?'<p class="danger">'+esc(r.error.message)+'</p>':'<p class="ok">Tersimpan.</p>'}
</script></body></html>
