<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KARDOBU Admin</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body>
<div id="login" class="login"><div class="logo">KARDOBU<i>.</i></div><p class="muted">ADMIN LOGIN</p><label>EMAIL</label><input id="email" type="email"><label>PASSWORD</label><input id="password" type="password"><button class="btn full" onclick="doLogin()">MASUK ADMIN</button><p id="err" class="error"></p></div>
<div id="app" class="wrap hidden"><header class="nav" style="position:static;margin:-30px -5% 25px"><a class="logo" href="index.html">KARDOBU<i>.</i></a><button class="mini" onclick="logout()">LOGOUT</button></header>
<div class="stats"><div class="stat">PRODUK<b id="pc">0</b></div><div class="stat">ORDER<b id="oc">0</b></div><div class="stat">PENDING<b id="pp">0</b></div><div class="stat">PAID<b id="pa">0</b></div></div>
<div class="panel"><h2 id="ft">Tambah Produk</h2><input id="pid" type="hidden"><label>NAMA</label><input id="name"><label>HARGA</label><input id="price" type="number"><label>STOK</label><input id="stock" type="number"><label>UKURAN</label><input id="sizes" value="S,M,L,XL"><label>STATUS</label><select id="status"><option>READY</option><option>PRE-ORDER</option><option>SOLD OUT</option></select><label>URL FOTO</label><input id="img"><label>DESKRIPSI</label><textarea id="desc" rows="4"></textarea><button class="btn" onclick="saveProduct()">SIMPAN</button> <button class="mini" onclick="resetForm()">BATAL</button></div>
<div class="panel"><h2>Produk</h2><div id="plist">Memuat...</div></div><div class="panel"><h2>Pesanan</h2><div id="olist">Memuat...</div></div>
<div class="panel"><h2>Pengaturan Toko</h2><label>WHATSAPP (62812...)</label><input id="wa"><label>INSTAGRAM</label><input id="ig"><label>JUDUL</label><input id="ht"><label>SUBJUDUL</label><input id="hs"><label>URL QRIS</label><input id="qris"><button class="btn" onclick="saveSettings()">SIMPAN PENGATURAN</button></div></div>
<script>
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const money=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(n)||0);const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function check(){let r=await db.auth.getSession();if(r.data.session)show()}check();async function doLogin(){err.textContent="";let r=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(r.error)return err.textContent=r.error.message;show()}function show(){login.classList.add("hidden");app.classList.remove("hidden");load()}async function logout(){await db.auth.signOut();location.reload()}
async function load(){loadProducts();loadOrders();loadSettings()}
async function loadProducts(){let r=await db.from("products").select("*").order("created_at",{ascending:false});if(r.error)return plist.innerHTML="<p class='error'>"+esc(r.error.message)+"</p>";pc.textContent=r.data.length;plist.innerHTML=r.data.map(p=>`<div class="productrow"><div class="thumb">${p.image_url?`<img src="${esc(p.image_url)}">`:""}</div><div><b>${esc(p.name)}</b><br><span class="muted">${money(p.price)} · stok ${p.stock} · ${esc(p.status)}</span></div><div class="actions"><button class="mini" onclick="edit('${p.id}')">EDIT</button><button class="mini" onclick="del('${p.id}')">HAPUS</button></div></div>`).join("")||"<p class='muted'>Kosong.</p>"}
async function saveProduct(){let o={name:name.value.trim(),price:Number(price.value||0),stock:Number(stock.value||0),sizes:sizes.value.split(",").map(x=>x.trim()).filter(Boolean),status:status.value,image_url:img.value.trim(),description:desc.value.trim()};if(!o.name)return alert("Nama wajib.");let r=pid.value?await db.from("products").update(o).eq("id",pid.value):await db.from("products").insert(o);if(r.error)return alert(r.error.message);resetForm();loadProducts()}
async function edit(id){let r=await db.from("products").select("*").eq("id",id).single();if(r.error)return alert(r.error.message);let p=r.data;pid.value=p.id;name.value=p.name;price.value=p.price;stock.value=p.stock;sizes.value=(p.sizes||[]).join(",");status.value=p.status;img.value=p.image_url||"";desc.value=p.description||"";ft.textContent="Edit Produk";scrollTo(0,0)}
async function del(id){if(!confirm("Hapus produk?"))return;let r=await db.from("products").delete().eq("id",id);if(r.error)alert(r.error.message);loadProducts()}function resetForm(){pid.value="";name.value="";price.value="";stock.value="0";sizes.value="S,M,L,XL";status.value="READY";img.value="";desc.value="";ft.textContent="Tambah Produk"}
async function loadOrders(){let r=await db.from("orders").select("*").order("created_at",{ascending:false});if(r.error)return olist.innerHTML="<p class='error'>"+esc(r.error.message)+"</p>";oc.textContent=r.data.length;pp.textContent=r.data.filter(x=>x.payment_status==="PENDING").length;pa.textContent=r.data.filter(x=>x.payment_status==="PAID").length;olist.innerHTML=r.data.map(o=>`<div class="orderrow"><div></div><div><b>${esc(o.order_code)}</b><br><span class="muted">${esc(o.customer_name)} · ${esc(o.customer_phone)} · ${money(o.total_amount)}<br>${esc(o.customer_address)}</span></div><select onchange="statusOrder('${o.id}',this.value)"><option ${o.payment_status==="PENDING"?"selected":""}>PENDING</option><option ${o.payment_status==="PAID"?"selected":""}>PAID</option><option ${o.payment_status==="CANCELLED"?"selected":""}>CANCELLED</option></select></div>`).join("")||"<p class='muted'>Belum ada order.</p>"}
async function statusOrder(id,v){let r=await db.from("orders").update({payment_status:v}).eq("id",id);if(r.error)alert(r.error.message);loadOrders()}
async function loadSettings(){let r=await db.from("store_settings").select("*").eq("id",1).single();if(r.data){wa.value=r.data.whatsapp_number||"";ig.value=r.data.instagram||"";ht.value=r.data.hero_title||"";hs.value=r.data.hero_subtitle||"";qris.value=r.data.qris_image_url||""}}
async function saveSettings(){let r=await db.from("store_settings").update({whatsapp_number:wa.value.trim(),instagram:ig.value.trim(),hero_title:ht.value.trim(),hero_subtitle:hs.value.trim(),qris_image_url:qris.value.trim(),updated_at:new Date().toISOString()}).eq("id",1);if(r.error)alert(r.error.message);else alert("Tersimpan")}
</script></body></html>
