<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KARDOBU — Admin Store</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://xmqxoczvjisasrysrkls.supabase.co";
const SUPABASE_KEY = "sb_publishable_qOIpMPw5J3EetOy5WdyTOQ_Lj_Tx1oC";

const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);
</script>

<style>

body{
    background:#050505;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    margin:0;
}

*{
    box-sizing:border-box;
}

button{
    cursor:pointer;
}

.header{
    height:70px;
    border-bottom:1px solid #222;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
    background:#080808;
}

.logo{
    font-size:24px;
    font-weight:900;
    letter-spacing:3px;
}

.logo span{
    color:#777;
}

.container{
    width:92%;
    max-width:1200px;
    margin:auto;
    padding:35px 0;
}

.login-box{
    width:92%;
    max-width:420px;
    margin:100px auto;
    padding:35px;
    background:#101010;
    border:1px solid #292929;
}

.login-box h1{
    margin-top:0;
}

label{
    display:block;
    color:#888;
    font-size:12px;
    margin:18px 0 7px;
    text-transform:uppercase;
    letter-spacing:1px;
}

input,
textarea,
select{
    width:100%;
    padding:13px;
    background:#171717;
    border:1px solid #333;
    color:white;
    outline:none;
}

textarea{
    min-height:100px;
    resize:vertical;
}

.btn{
    background:white;
    color:black;
    border:0;
    padding:13px 20px;
    font-weight:bold;
}

.btn-dark{
    background:#171717;
    color:white;
    border:1px solid #444;
    padding:11px 16px;
}

.full{
    width:100%;
    margin-top:20px;
}

.error{
    color:#ff7777;
    margin-top:15px;
}

.success{
    color:#78ff8a;
    margin-top:15px;
}

.dashboard{
    display:none;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat{
    background:#101010;
    border:1px solid #292929;
    padding:22px;
}

.stat span{
    color:#777;
    font-size:12px;
}

.stat strong{
    display:block;
    font-size:30px;
    margin-top:8px;
}

.panel{
    background:#101010;
    border:1px solid #292929;
    padding:25px;
    margin-bottom:25px;
}

.panel h2{
    margin-top:0;
}

.product{
    border-top:1px solid #292929;
    padding:18px 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.product-info{
    flex:1;
}

.product-info strong{
    font-size:18px;
}

.product-info small{
    display:block;
    color:#777;
    margin-top:7px;
}

.actions{
    display:flex;
    gap:8px;
}

.order{
    border-top:1px solid #292929;
    padding:18px 0;
}

.order strong{
    font-size:17px;
}

.order small{
    display:block;
    color:#888;
    line-height:1.7;
}

.hidden{
    display:none!important;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

@media(max-width:700px){

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .row{
        grid-template-columns:1fr;
    }

    .product{
        display:block;
    }

    .actions{
        margin-top:15px;
    }

}

</style>
</head>

<body>

<header class="header">

<div class="logo">
KARDOBU<span>.</span>
</div>

<button
class="btn-dark"
onclick="logout()">
LOGOUT
</button>

</header>


<!-- ================= LOGIN ================= -->

<div id="loginPage" class="login-box">

<h1>Admin KARDOBU</h1>

<p style="color:#777">
Masuk menggunakan akun Supabase kamu.
</p>

<label>Email</label>

<input
id="email"
type="email"
placeholder="Email admin"
autocomplete="username"
>

<label>Password</label>

<input
id="password"
type="password"
placeholder="Password"
autocomplete="current-password"
>

<button
class="btn full"
onclick="login()">
MASUK ADMIN
</button>

<div id="loginMessage"></div>

</div>


<!-- ================= DASHBOARD ================= -->

<div id="dashboard" class="dashboard">

<div class="container">

<h1>Dashboard KARDOBU</h1>

<p style="color:#777">
Kelola produk dan pesanan toko.
</p>


<!-- STATISTIK -->

<div class="stats">

<div class="stat">
<span>TOTAL PRODUK</span>
<strong id="totalProducts">0</strong>
</div>

<div class="stat">
<span>TOTAL ORDER</span>
<strong id="totalOrders">0</strong>
</div>

<div class="stat">
<span>PENDING</span>
<strong id="pendingOrders">0</strong>
</div>

<div class="stat">
<span>PAID</span>
<strong id="paidOrders">0</strong>
</div>

</div>


<!-- ================= PRODUK ================= -->

<div class="panel">

<h2 id="productFormTitle">
Tambah Produk
</h2>

<input
type="hidden"
id="editProductId"
>

<label>Nama Produk</label>

<input
id="productName"
placeholder="Contoh: KARDOBU Polo Black"
>

<div class="row">

<div>

<label>Harga</label>

<input
id="productPrice"
type="number"
placeholder="210000"
>

</div>

<div>

<label>Stok</label>

<input
id="productStock"
type="number"
placeholder="10"
>

</div>

</div>


<label>Ukuran</label>

<input
id="productSizes"
value="S,M,L,XL"
placeholder="S,M,L,XL"
>


<label>Status</label>

<select id="productStatus">

<option value="READY">
READY
</option>

<option value="PRE-ORDER">
PRE-ORDER
</option>

<option value="SOLD OUT">
SOLD OUT
</option>

</select>


<label>URL Foto Produk</label>

<input
id="productImage"
placeholder="https://..."
>


<label>Deskripsi Produk</label>

<textarea
id="productDescription"
placeholder="Deskripsi produk..."
></textarea>


<button
class="btn"
onclick="saveProduct()">
SIMPAN PRODUK
</button>

<button
class="btn-dark"
onclick="resetProductForm()">
RESET
</button>

<div id="productMessage"></div>

</div>


<!-- ================= DAFTAR PRODUK ================= -->

<div class="panel">

<h2>Daftar Produk</h2>

<div id="productList">

Memuat produk...

</div>

</div>


<!-- ================= PESANAN ================= -->

<div class="panel">

<h2>Pesanan Masuk</h2>

<div id="orderList">

Memuat pesanan...

</div>

</div>


<!-- ================= PENGATURAN ================= -->

<div class="panel">

<h2>Pengaturan Toko</h2>

<label>Nama Toko</label>

<input
id="shopName"
value="KARDOBU"
>


<label>Nomor WhatsApp</label>

<input
id="whatsapp"
placeholder="628123456789"
>


<label>Instagram</label>

<input
id="instagram"
placeholder="@kardobu"
>


<label>Judul Beranda</label>

<input
id="heroTitle"
value="WEAR YOUR IDENTITY."
>


<label>Subjudul Beranda</label>

<textarea
id="heroSubtitle"
>Premium streetwear dengan karakter kuat.</textarea>


<label>URL QRIS</label>

<input
id="qris"
placeholder="https://..."
>


<br><br>

<button
class="btn"
onclick="saveSettings()">
SIMPAN PENGATURAN
</button>

<div id="settingsMessage"></div>

</div>

</div>

</div>


<script>

/* =========================================
   LOGIN
========================================= */

async function login(){

const emailValue =
document.getElementById("email").value.trim();

const passwordValue =
document.getElementById("password").value;

const message =
document.getElementById("loginMessage");

message.className="";
message.innerText="Memproses login...";

if(!emailValue || !passwordValue){

message.className="error";
message.innerText=
"Email dan password wajib diisi.";

return;

}

const {data,error} =
await db.auth.signInWithPassword({

email:emailValue,

password:passwordValue

});

if(error){

message.className="error";

message.innerText=
"Login gagal: "+error.message;

return;

}

showDashboard();

}


/* =========================================
   CHECK LOGIN
========================================= */

async function checkLogin(){

const {data} =
await db.auth.getSession();

if(data.session){

showDashboard();

}

}


/* =========================================
   SHOW DASHBOARD
========================================= */

function showDashboard(){

document.getElementById("loginPage")
.style.display="none";

document.getElementById("dashboard")
.style.display="block";

loadAll();

}


/* =========================================
   LOGOUT
========================================= */

async function logout(){

await db.auth.signOut();

location.reload();

}


/* =========================================
   LOAD ALL
========================================= */

async function loadAll(){

await loadProducts();

await loadOrders();

await loadSettings();

}


/* =========================================
   FORMAT RUPIAH
========================================= */

function rupiah(number){

return new Intl.NumberFormat(
"id-ID",
{
style:"currency",
currency:"IDR",
maximumFractionDigits:0
}
).format(Number(number)||0);

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(text){

return String(text ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =========================================
   LOAD PRODUCTS
========================================= */

async function loadProducts(){

const {data,error} =
await db
.from("products")
.select("*")
.order("created_at",{ascending:false});

if(error){

document.getElementById("productList")
.innerHTML=
"<p class='error'>"+
escapeHtml(error.message)+
"</p>";

return;

}

document.getElementById("totalProducts")
.innerText=data.length;

const list =
document.getElementById("productList");

if(!data.length){

list.innerHTML=
"<p style='color:#777'>Belum ada produk.</p>";

return;

}

list.innerHTML=data.map(product=>`

<div class="product">

<div class="product-info">

<strong>
${escapeHtml(product.name)}
</strong>

<small>
Harga: ${rupiah(product.price)}
</small>

<small>
Stok: ${product.stock}
</small>

<small>
Status: ${escapeHtml(product.status)}
</small>

</div>

<div class="actions">

<button
class="btn-dark"
onclick="editProduct('${product.id}')">
EDIT
</button>

<button
class="btn-dark"
onclick="deleteProduct('${product.id}')">
HAPUS
</button>

</div>

</div>

`).join("");

}


/* =========================================
   SAVE PRODUCT
========================================= */

async function saveProduct(){

const id =
document.getElementById("editProductId").value;

const name =
document.getElementById("productName")
.value.trim();

const price =
Number(document.getElementById("productPrice").value||0);

const stock =
Number(document.getElementById("productStock").value||0);

const sizes =
document.getElementById("productSizes")
.value
.split(",")
.map(x=>x.trim())
.filter(Boolean);

const status =
document.getElementById("productStatus")
.value;

const image =
document.getElementById("productImage")
.value.trim();

const description =
document.getElementById("productDescription")
.value.trim();

if(!name){

alert("Nama produk wajib diisi.");

return;

}

const product={

name:name,

price:price,

stock:stock,

sizes:sizes,

status:status,

image_url:image,

description:description

};

let result;

if(id){

result=
await db
.from("products")
.update(product)
.eq("id",id);

}else{

result=
await db
.from("products")
.insert(product);

}

if(result.error){

alert(
"Gagal menyimpan: "+
result.error.message
);

return;

}

document.getElementById("productMessage")
.className="success";

document.getElementById("productMessage")
.innerText=
"Produk berhasil disimpan.";

resetProductForm();

loadProducts();

}


/* =========================================
   EDIT PRODUCT
========================================= */

async function editProduct(id){

const {data,error} =
await db
.from("products")
.select("*")
.eq("id",id)
.single();

if(error){

alert(error.message);

return;

}

document.getElementById("editProductId")
.value=data.id;

document.getElementById("productName")
.value=data.name;

document.getElementById("productPrice")
.value=data.price;

document.getElementById("productStock")
.value=data.stock;

document.getElementById("productSizes")
.value=(data.sizes||[])
.join(",");

document.getElementById("productStatus")
.value=data.status;

document.getElementById("productImage")
.value=data.image_url||"";

document.getElementById("productDescription")
.value=data.description||"";

document.getElementById("productFormTitle")
.innerText="Edit Produk";

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* =========================================
   DELETE PRODUCT
========================================= */

async function deleteProduct(id){

if(!confirm(
"Yakin ingin menghapus produk ini?"
)){

return;

}

const {error} =
await db
.from("products")
.delete()
.eq("id",id);

if(error){

alert(
"Gagal menghapus: "+
error.message
);

return;

}

loadProducts();

}


/* =========================================
   RESET PRODUCT
========================================= */

function resetProductForm(){

document.getElementById("editProductId")
.value="";

document.getElementById("productName")
.value="";

document.getElementById("productPrice")
.value="";

document.getElementById("productStock")
.value="0";

document.getElementById("productSizes")
.value="S,M,L,XL";

document.getElementById("productStatus")
.value="READY";

document.getElementById("productImage")
.value="";

document.getElementById("productDescription")
.value="";

document.getElementById("productFormTitle")
.innerText="Tambah Produk";

}


/* =========================================
   LOAD ORDERS
========================================= */

async function loadOrders(){

const {data,error} =
await db
.from("orders")
.select("*")
.order("created_at",{ascending:false});

if(error){

document.getElementById("orderList")
.innerHTML=
"<p class='error'>"+
escapeHtml(error.message)+
"</p>";

return;

}

document.getElementById("totalOrders")
.innerText=data.length;

document.getElementById("pendingOrders")
.innerText=
data.filter(x=>
x.payment_status==="PENDING"
).length;

document.getElementById("paidOrders")
.innerText=
data.filter(x=>
x.payment_status==="PAID"
).length;

if(!data.length){

document.getElementById("orderList")
.innerHTML=
"<p style='color:#777'>Belum ada pesanan.</p>";

return;

}

document.getElementById("orderList")
.innerHTML=
data.map(order=>`

<div class="order">

<strong>
${escapeHtml(order.order_code)}
</strong>

<small>
Nama:
${escapeHtml(order.customer_name)}
</small>

<small>
WhatsApp:
${escapeHtml(order.customer_phone)}
</small>

<small>
Alamat:
${escapeHtml(order.customer_address)}
</small>

<small>
Total:
${rupiah(order.total_amount)}
</small>

<small>
Catatan:
${escapeHtml(order.note||"-")}
</small>

<br>

<select
onchange="changeOrderStatus('${order.id}',this.value)">

<option
value="PENDING"
${order.payment_status==="PENDING"?"selected":""}>
PENDING
</option>

<option
value="PAID"
${order.payment_status==="PAID"?"selected":""}>
PAID
</option>

<option
value="CANCELLED"
${order.payment_status==="CANCELLED"?"selected":""}>
CANCELLED
</option>

</select>

</div>

`).join("");

}


/* =========================================
   CHANGE ORDER STATUS
========================================= */

async function changeOrderStatus(id,status){

const {error} =
await db
.from("orders")
.update({
payment_status:status
})
.eq("id",id);

if(error){

alert(error.message);

return;

}

loadOrders();

}


/* =========================================
   LOAD SETTINGS
========================================= */

async function loadSettings(){

const {data,error} =
await db
.from("store_settings")
.select("*")
.eq("id",1)
.single();

if(error){

console.log(error);

return;

}

if(!data)return;

document.getElementById("shopName")
.value=data.shop_name||"KARDOBU";

document.getElementById("whatsapp")
.value=data.whatsapp_number||"";

document.getElementById("instagram")
.value=data.instagram||"";

document.getElementById("heroTitle")
.value=data.hero_title||"";

document.getElementById("heroSubtitle")
.value=data.hero_subtitle||"";

document.getElementById("qris")
.value=data.qris_image_url||"";

}


/* =========================================
   SAVE SETTINGS
========================================= */

async function saveSettings(){

const update={

shop_name:
document.getElementById("shopName")
.value.trim(),

whatsapp_number:
document.getElementById("whatsapp")
.value.trim(),

instagram:
document.getElementById("instagram")
.value.trim(),

hero_title:
document.getElementById("heroTitle")
.value.trim(),

hero_subtitle:
document.getElementById("heroSubtitle")
.value.trim(),

qris_image_url:
document.getElementById("qris")
.value.trim(),

updated_at:
new Date().toISOString()

};

const {error} =
await db
.from("store_settings")
.update(update)
.eq("id",1);

if(error){

document.getElementById("settingsMessage")
.className="error";

document.getElementById("settingsMessage")
.innerText=
"Gagal menyimpan: "+
error.message;

return;

}

document.getElementById("settingsMessage")
.className="success";

document.getElementById("settingsMessage")
.innerText=
"Pengaturan berhasil disimpan.";

}


/* =========================================
   START
========================================= */

checkLogin();

</script>

</body>
</html>
